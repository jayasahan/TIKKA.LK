<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="TIKKA operations sign in.">
    <title>TIKKA Admin Sign In</title>
    <link rel="preload" href="public/brand/tikka-logo.jpg" as="image">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="ops">
    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main" class="ops-login">
      <section class="ops-login__card">
        <a class="brand" href="index.html" aria-label="TIKKA home">
          <img src="public/brand/tikka-logo.jpg" alt="TIKKA logo" width="1600" height="1200">
        </a>
        <p class="eyebrow">Operations</p>
        <h1>Admin sign in</h1>
        <p>This area is for TIKKA operations. Customer accounts cannot sign in here.</p>
        <form id="admin-login-form" data-admin-login novalidate>
          <div class="form-error-summary" data-error-summary role="alert" hidden></div>
          <label class="field">
            <span>Email <em>required</em></span>
            <input name="email" type="email" autocomplete="username" required>
          </label>
          <label class="field">
            <span>Password <em>required</em></span>
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="button button--primary" type="submit" data-admin-login-submit>Sign in</button>
          <p class="form-message" data-admin-login-message role="status" aria-live="polite"></p>
        </form>
        <a class="text-action ops-login__back" href="index.html#home">Back to TIKKA home</a>
      </section>
    </main>
    <script src="forms.js"></script>
    <script>
      const form = document.querySelector("[data-admin-login]");
      const message = document.querySelector("[data-admin-login-message]");
      const submitButton = document.querySelector("[data-admin-login-submit]");
      TikkaForms.bind(form);
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!TikkaForms.validate(form)) {
          message.textContent = "Please correct the highlighted fields.";
          message.dataset.tone = "error";
          return;
        }
        message.textContent = "Signing in...";
        message.dataset.tone = "neutral";
        TikkaForms.setBusy(submitButton, true, "Signing in...");
        try {
          const body = Object.fromEntries(new FormData(form).entries());
          const response = await fetch("/api/admin/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const payload = await response.json();
          if (!response.ok) {
            const error = new Error(payload.error || "Sign in failed.");
            error.payload = payload;
            throw error;
          }
          window.location.replace("/admin.html");
        } catch (error) {
          TikkaForms.applyServerErrors(form, error.payload?.errors);
          message.textContent = error.message;
          message.dataset.tone = "error";
        } finally {
          TikkaForms.setBusy(submitButton, false);
        }
      });
    </script>
  </body>
</html>
